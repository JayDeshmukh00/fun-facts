<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fun Hub 😄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="card">
        <h1>🎉 Fun Hub</h1>
        <p>Your daily dose of fun</p>

        <div class="buttons">
            <button onclick="catFact()">🐾 Cat</button>
            <button onclick="dogFact()">🐶 Dog</button>
            <button onclick="joke()">😂 Joke</button>
            <button onclick="marathiJoke()">😹 Marathi</button>
            <button onclick="crazyFact()">🤯 Crazy</button>
            <button onclick="showNostalgia()">📼 Nostalgia</button>
            <button onclick="retroMusic()">🎵 Retro</button>
            <button onclick="oldGames()">🎮 Games</button>
            <button onclick="challenge()">🎯 Challenge</button>
            <button onclick="saveFav()">❤️ Save</button>
        </div>

        <div id="content">
            Click any button and enjoy 🚀
        </div>

        
    </div>

    <!-- Sounds -->
    <audio id="clickSound" src="click.mp3"></audio>
    <audio id="successSound" src="success.mp3"></audio>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- JS -->
    <script src="./app.js"></script>
</body>
</html>
